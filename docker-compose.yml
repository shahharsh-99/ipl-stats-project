services:
  api:
    build: .
    command: python python/most_runs_by_year.py --server
    environment:
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?Set API_BEARER_TOKEN before starting Compose}
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    command: python python/visualization_app.py
    environment:
      API_BASE_URL: http://api:5005
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?Set API_BEARER_TOKEN before starting Compose}
      VIS_PORT: 8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"